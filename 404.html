<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404: Not Found | Lone Coder</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
  .error-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem 1.5rem;
  }
  .terminal-window{
    width:100%; max-width:600px;
    background:var(--bg-card);
    border:1px solid var(--border-strong);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(45,212,191,.08), 0 20px 48px rgba(0,0,0,.45);
  }
  .terminal-titlebar{
    display:flex; align-items:center; gap:.4rem;
    height:38px; padding:0 .9rem;
    background:var(--bg-elevated);
    border-bottom:1px solid var(--border);
    position:relative;
  }
  .terminal-dot{ width:11px; height:11px; border-radius:50%; }
  .terminal-dot.red{ background:#ff5f56; }
  .terminal-dot.yellow{ background:#ffbd2e; }
  .terminal-dot.green{ background:#27c93f; }
  .terminal-title{
    position:absolute; left:0; right:0; text-align:center;
    font-family:var(--font-mono); font-size:.78rem; color:var(--text-dim);
    pointer-events:none;
  }
  .terminal-body{
    padding:1.5rem 1.6rem 1.7rem;
    font-family:var(--font-mono);
    font-size:.88rem;
    line-height:1.85;
    text-align:left;
    color:var(--text-dim);
  }
  .terminal-body .row{
    opacity:0;
    animation:type-in .4s ease forwards;
  }
  .terminal-body .row:nth-child(1){ animation-delay:.1s; }
  .terminal-body .row:nth-child(2){ animation-delay:.5s; }
  .terminal-body .row:nth-child(3){ animation-delay:1.1s; }
  .terminal-body .row:nth-child(4){ animation-delay:1.5s; }
  .terminal-body .row:nth-child(5){ animation-delay:2.1s; }
  @keyframes type-in{
    from{ opacity:0; transform:translateY(2px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .prompt{ color:var(--accent); }
  .path-sep{ color:var(--text-dim); }
  .err-text{ color:#ff6b6b; }
  .req-path{ color:var(--text); word-break:break-all; }
  .home-link{ color:var(--accent); text-decoration:none; }
  .home-link:hover{ color:var(--accent-hover); text-decoration:underline; }
  .cursor{
    display:inline-block; width:8px; height:1em;
    background:var(--accent); vertical-align:text-bottom;
    margin-left:.2rem;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
</style>
</head>
<body>

<main class="error-page">
  <div class="terminal-window">
    <div class="terminal-titlebar">
      <span class="terminal-dot red"></span>
      <span class="terminal-dot yellow"></span>
      <span class="terminal-dot green"></span>
      <span class="terminal-title">guest@lonecoder: ~</span>
    </div>
    <div class="terminal-body">
      <p class="row"><span class="prompt">guest@lonecoder</span><span class="path-sep">:~$</span> cd <span class="req-path" id="reqPath">/requested-page</span></p>
      <p class="row err-text">bash: cd: <span class="req-path" id="reqPath2">/requested-page</span>: No such file or directory</p>
      <p class="row"><span class="prompt">guest@lonecoder</span><span class="path-sep">:~$</span> locate --page lone-coder</p>
      <p class="row err-text">404: route not found in memory</p>
      <p class="row"><span class="prompt">guest@lonecoder</span><span class="path-sep">:~$</span> <a href="/" class="home-link">cd ~</a><span class="cursor"></span></p>
    </div>
  </div>
</main>

<script>
  var path = window.location.pathname || '/requested-page';
  var a = document.getElementById('reqPath');
  var b = document.getElementById('reqPath2');
  if (a) a.textContent = path;
  if (b) b.textContent = path;
</script>

</body>
</html>
